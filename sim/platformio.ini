; Wokwi sim — Conor's original ESP32 + FastLED rainbow chase across his
; dodecahedron canvas layout (single-board, single data pin, no bridge).
; Mirrors https://wokwi.com/projects/395138984376795137.
[env:esp32dev]
platform           = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board              = esp32dev
framework          = arduino
monitor_speed      = 115200

lib_deps =
    fastled/FastLED@^3.6.0
