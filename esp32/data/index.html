<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050507">
  <title>Infinity · Meta Sonic Flux</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="app">
    <!-- particle dust — always on, behind everything -->
    <canvas class="bg-particles" data-msf-particles data-color="#F2EFE9"></canvas>

    <header>
      <span class="brand">Meta Sonic Flux</span>
      <span id="pulse" class="pulse" data-state="idle">Idle</span>
    </header>

    <!-- ===== takeover / idle ===== -->
    <section id="takeover" class="takeover" aria-live="polite">
      <!-- pixel-grid reference — led matrix. hero/section-break only. -->
      <div class="bg-grid" aria-hidden="true"></div>

      <canvas
        class="mark anim-breath"
        data-msf-shape="dodeca"
        data-color="#FF0099"
        data-speed="0.7"
        aria-hidden="true"></canvas>

      <div>
        <p class="display title" id="installation-name">Infinity</p>
        <p class="takeover-blurb" id="takeover-blurb">Let's get melty.</p>
      </div>

      <button id="btn-takeover" type="button" class="takeover-btn">
        Take the controls
      </button>
      <p id="takeover-count" class="takeover-count hidden" aria-live="assertive"></p>
    </section>

    <!-- ===== holding screen (someone else is at the controls) ===== -->
    <!-- Reuses .takeover layout. Content + amber mark injected by app.js so the
         canvas mounts at the right size, like the fire stages. -->
    <section id="holding" class="takeover hidden" aria-live="polite"></section>

    <!-- ===== question card ===== -->
    <section id="card" class="card" aria-live="polite">
      <p class="label q-label">Question</p>
      <p id="question" class="question">Loading</p>

      <!-- binary -->
      <div id="binary-input" class="buttons">
        <button id="btn-yes" type="button" class="yes" disabled>Yes</button>
        <button id="btn-no"  type="button" class="no"  disabled>No</button>
      </div>

      <!-- choice (N options, populated by app.js) -->
      <div id="choice-input" class="choices hidden" role="group"></div>

      <!-- riddle -->
      <form id="riddle-input" class="riddle hidden" autocomplete="off">
        <input id="riddle-text"
               type="text"
               inputmode="text"
               autocomplete="off"
               autocapitalize="off"
               autocorrect="off"
               spellcheck="false"
               placeholder="Type your answer"
               aria-label="riddle answer">
        <button id="btn-submit" type="submit" class="submit">Answer</button>
        <p id="riddle-hint" class="hint" aria-live="polite"></p>
      </form>
    </section>

    <!-- ===== response ===== -->
    <section id="response" class="response hidden" aria-live="polite">
      <p class="label">Response</p>
      <p id="response-msg" class="response-msg"></p>
      <p id="response-sub" class="response-sub hidden"></p>
      <p class="look-up">Look up <span class="arrow" aria-hidden="true">↑</span></p>
      <button id="btn-again" type="button" class="again">And I go at it again</button>
    </section>

    <!-- ===== fire stage (innerHTML swapped by app.js) ===== -->
    <section id="fire-stage" class="fire-stage hidden" aria-live="polite"></section>

    <footer>
      <p id="stats" class="stats"></p>
    </footer>
  </main>

  <script src="/geometry.js"></script>
  <script src="/particles.js"></script>
  <script src="/app.js"></script>
</body>
</html>
