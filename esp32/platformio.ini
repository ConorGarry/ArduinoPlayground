; ESP32 firmware for the Infinity / Meta Sonic Flux web-app bridge.
; Spec: ../docs/ESP32-Web-App.md
;
; This is a sibling PlatformIO project to the Teensy firmware in ../ . Keep
; them separate so the ESP32 toolchain (espressif32 platform) doesn't drag
; into the Teensy build.

[env:esp32dev]
; Community fork — gets us Arduino-ESP32 3.x + ESP-IDF 5.1+, which is required
; for the RFC 8910 DHCP option 114 (ESP_NETIF_CAPTIVEPORTAL_URI) used by
; wifi_ap.h to advertise the captive portal URL directly via DHCP. The stock
; PlatformIO espressif32 platform is still on ESP-IDF 4.4 as of v6.10 and
; doesn't expose that API. First build will download the new toolchain
; (~5 minutes one-off).
platform           = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board              = esp32dev
framework          = arduino
monitor_speed      = 115200
upload_speed       = 460800

; A Teensy is usually plugged into this Mac alongside the ESP32. The Teensy
; enumerates as /dev/cu.usbmodem* (native USB) and PlatformIO's port
; auto-detect would grab it first, sending esptool at the wrong board
; ("Failed to connect to ESP32: No serial data received"). The ESP32 dev
; board talks through a CH340 bridge -> /dev/cu.usbserial-NNNN, so pin the
; port to skip the Teensy. NOTE: an explicit upload_port bypasses port
; auto-detect, so this must be an exact path (wildcards are NOT expanded).
; If the suffix ever changes (different USB port/hub), find the new one with
;   ls /dev/cu.usbserial-*
upload_port        = /dev/cu.usbserial-1420
monitor_port       = /dev/cu.usbserial-1420

board_build.filesystem = littlefs

; Pre-build hooks (run before the firmware + LittleFS image are built):
;   gen_patterns.py — regenerate data/patterns.json from the Teensy's
;     app_patterns.h; fail the build if any pattern ID / fire-command name has
;     drifted out of sync across the two firmwares.
;   gzip_assets.py  — pre-compress the captive-portal assets to <file>.gz so
;     serveStatic() can serve them gzipped (cuts the connect-storm transfer).
extra_scripts =
    pre:../tools/gen_patterns.py
    pre:../tools/gzip_assets.py

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
